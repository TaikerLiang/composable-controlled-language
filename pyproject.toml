# One uv project. Runtime is stdlib-only (tomllib needs Python >= 3.11); ruff and
# pytest are dev dependencies and are never imported by the package.
#   uv run pytest
#   uv run ruff check .
#   uv run controlled-english lint .
# The profile directories live at the repository root so the layering is visible;
# hatch copies them into the wheel so `uvx --from git+…@vX.Y.Z controlled-english`
# finds them without a checkout.

[project]
name = "controlled-english"
version = "0.1.0"
description = "Composable controlled-English linter for agent-facing repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
controlled-english = "controlled_english.cli:main"
ccl = "controlled_english.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlled_english"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "controlled_english/profiles"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
