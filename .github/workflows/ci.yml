name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run controlled-english check-fixtures
      - name: dogfood (explanatory surfaces; warnings reported, errors fail)
        run: uv run controlled-english lint --format compact .
      - name: wheel carries the profiles
        run: |
          uv build -q
          uvx --from dist/*.whl controlled-english rules | grep -q BASE-S01
