id       = "BASE-S08"
revision = 1
title    = "Two imperatives joined by a bare `and` are two steps unless simultaneous"
layer    = "base"
check    = "both"
kind     = "pattern"
source   = "ste-derived"
lineage  = ["STE 5.2"]
severity = { runtime = "advisory", explanatory = "advisory" }
message  = "`{match}` joins two imperatives. If they happen one after the other, write two sentences or a list."
rationale = """
STE allows two actions in one sentence only when they are simultaneous. Whether
they are is a question about the actions, not about the words, so the
deterministic check only points at the sentence and the judgment prompt decides.
A bare `and` is never silently treated as compliant.
"""

[params]
pattern = '^(?:{{verbs}})\b[^,.;]*?\s(?P<match>and)\s(?:{{verbs}})\b'

[[examples]]
bad  = "Open the PR and merge it."
good = "Open the PR. Merge it."

[judgment]
prompt = "The sentence joins two actions with `and`. Are they performed at the same time, or one after the other? Answer simultaneous | sequential, then one sentence why."
